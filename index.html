<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track income, expenses, and your current balance.">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Expense Tracker</h1>
    <p>Track your daily income and expenses</p>
  </header>

  <main class="container">
    <section class="summary-cards" aria-label="Balance summary">
      <div class="card income-card">
        <h3>Total Income</h3>
        <p id="totalIncome">₹0.00</p>
      </div>
      <div class="card expense-card">
        <h3>Total Expense</h3>
        <p id="totalExpense">₹0.00</p>
      </div>
      <div class="card balance-card">
        <h3>Net Balance</h3>
        <p id="totalBalance">₹0.00</p>
      </div>
    </section>

    <section class="form-section">
      <h2>Add New Transaction</h2>
      <form id="transactionForm">
        <div class="form-control">
          <label for="desc">Description</label>
          <input
            type="text"
            id="desc"
            placeholder="e.g., Book purchase, Salary..."
            required
            minlength="3"
            maxlength="100"
            autocomplete="off"
          >
        </div>

        <div class="form-control">
          <label for="amount">Amount (₹)</label>
          <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            required
            min="0.01"
            step="0.01"
          >
        </div>

        <div class="form-control">
          <label for="type">Type</label>
          <select id="type" required>
            <option value="income">Income (+)</option>
            <option value="expense">Expense (-)</option>
          </select>
        </div>

        <button type="submit" class="btn">Add Transaction</button>
      </form>
      <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
    </section>

    <section class="history-section">
      <h2>Transaction History</h2>
      <ul id="transactionList" class="list"></ul>
      <p class="storage-note">Transactions are saved in this browser on this device.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
